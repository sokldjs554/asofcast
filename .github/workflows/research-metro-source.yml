name: Metro source quality inspection
on:
  push:
    branches: [research/causal-action-value-20261002]
    paths: [.github/workflows/research-metro-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - name: Inspect original timestamps and completeness without model scores
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,zipfile,io,gzip
          from pathlib import Path
          import pandas as pd
          import numpy as np
          url='https://archive.ics.uci.edu/static/public/492/metro%2Binterstate%2Btraffic%2Bvolume.zip'
          out=Path('export');out.mkdir()
          with urllib.request.urlopen(url,timeout=120) as r:data=r.read()
          (out/'metro.zip').write_bytes(data)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              files=[n for n in z.namelist() if n.endswith('.csv.gz')]
              if len(files)!=1:raise ValueError('unexpected original archive')
              frame=pd.read_csv(io.BytesIO(gzip.decompress(z.read(files[0]))))
          dates=pd.to_datetime(frame['date_time'])
          columns=['temp','rain_1h','snow_1h','clouds_all','traffic_volume']
          valid=np.isfinite(frame[columns].to_numpy()).all(1)&(frame['temp']>0)&(frame[['rain_1h','snow_1h','traffic_volume']]>=0).all(1)&frame['clouds_all'].between(0,100)
          cleaned=frame.loc[valid].copy();cleaned['date_time']=dates.loc[valid]
          cleaned=cleaned.sort_values('date_time',kind='stable').drop_duplicates('date_time',keep='first')
          breaks=cleaned['date_time'].diff().dt.total_seconds().ne(3600).cumsum()
          groups=cleaned.groupby(breaks,sort=True)
          block=max(groups,key=lambda p:len(p[1]))[1]
          result={'purpose':'quality metadata only; no training or performance examination','source_url':url,'sha256':hashlib.sha256(data).hexdigest(),'original_rows':len(frame),'columns':list(frame.columns),'raw_duplicate_timestamps':int(dates.duplicated().sum()),'rejected_invalid_rows':int((~valid).sum()),'unique_valid_rows':len(cleaned),'longest_regular_block':{'rows':len(block),'first':str(block['date_time'].iloc[0]),'last':str(block['date_time'].iloc[-1])},'processing':'finite numeric values, temperature >0 K, rain/snow/volume >=0, clouds in [0,100]; chronological stable first duplicate; longest consecutive hourly block, earliest on equal length; no interpolation'}
          (out/'metadata.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asofcast-metro-source-candidate
          path: export/
          if-no-files-found: error
          retention-days: 7

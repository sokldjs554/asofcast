name: Research data preparation
on:
  push:
    branches: [research/causal-action-value-20261002]
    paths: [.github/workflows/research-data.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preprocessing dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3'
      - name: Verify original sources and prepare already-exposed development data
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, hashlib
          from pathlib import Path
          from asofcast.research_data import prepare_source
          from asofcast.information_data import prepare_information_source
          p = json.loads(Path('configs/information_value_20260929.json').read_text())
          out = Path('export'); out.mkdir()
          records = {}
          for name in ['ETTh1', 'ETTh2', 'Appliances', 'Tetouan', 'Jena2020', 'GasCO']:
              fn = prepare_information_source if name in ['Jena2020', 'GasCO'] else prepare_source
              path, record = fn(name, Path('download'), p)
              record['test_previously_exposed_before_protocol'] = True
              record['purpose'] = 'already-exposed development only; not fresh confirmation'
              shutil.copyfile(path, out / (name + '.csv'))
              records[name] = record
              print(name, record['prepared_sha256'], flush=True)
          (out / 'provenance.json').write_text(json.dumps(records, indent=2, ensure_ascii=False))
          (out / 'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(x.read_bytes()).hexdigest() + '  ' + x.name for x in sorted(out.glob('*.csv'))) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asofcast-development-data
          path: export/
          if-no-files-found: error
          retention-days: 7

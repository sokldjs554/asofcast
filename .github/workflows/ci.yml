name: AsOfCast verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU framework and project
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,research]'
      - name: Unit and integration tests
        run: python -m pytest --cov=asofcast --cov-report=term-missing -q
      - name: Syntax and CLI
        run: |
          python -m compileall -q src
          node --check src/asofcast/static/app.js
          python -m asofcast --help

  real-data:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU training stack
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Fetch pinned ETTh1 source
        run: python -m asofcast fetch-ett --out data/raw/ETTh1.csv
      - name: Train and evaluate full ETTh1 experiment
        run: |
          python -m asofcast run --csv data/raw/ETTh1.csv --source-kind ett --config configs/ett_m1.json --out artifacts/ett-m1
          python -m asofcast verify --artifacts artifacts/ett-m1
      - name: Preserve real-data evidence
        uses: actions/upload-artifact@v4
        with:
          name: ett-m1-bundle
          path: |
            artifacts/ett-m1
            data/raw/ETTh1.source.json
            data/raw/ETTh1.csv
          if-no-files-found: error
          retention-days: 14

  optimization:
    needs: real-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: ett-m1-bundle
          path: ci-input
      - name: Install ONNX Runtime stack
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[optimize]'
      - name: Measure PyTorch INT8 and ONNX Runtime
        run: |
          python -m asofcast benchmark --artifacts ci-input/artifacts/ett-m1 --out optimization-int8.json --repeats 300
          python scripts/check_onnx_runtime.py --artifacts ci-input/artifacts/ett-m1 --out optimization-onnx
          python -m asofcast serving-runtime --artifacts ci-input/artifacts/ett-m1 --out optimization-onnx/serving-runtime --threads 2
      - name: Preserve optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-evidence
          path: |
            optimization-int8.json
            optimization-onnx/
          if-no-files-found: error
          retention-days: 14


  container-cloud:
    needs: [real-data, optimization]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ett-m1-bundle
          path: ci-input
      - uses: actions/download-artifact@v4
        with:
          name: optimization-evidence
          path: ci-runtime
      - name: Resolve immutable model and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > container-env.sh
          import json
          bundle=json.load(open('ci-input/artifacts/ett-m1/report.json', encoding='utf-8'))
          runtime=json.load(open('ci-runtime/optimization-onnx/serving-runtime/runtime-manifest.json', encoding='utf-8'))
          assert bundle['run_id'] == runtime['bundle_run_id']
          print(f"RUN_ID={bundle['run_id']}")
          print(f"RUNTIME_SHA={runtime['onnx_sha256']}")
          PY
          cat container-env.sh
      - name: Build CPU ONNX serving image
        run: docker build --pull -t asofcast:ci .
      - name: Run ONNX container, smoke, restart and smoke again
        shell: bash
        run: |
          set -euo pipefail
          source container-env.sh
          mkdir -p container-evidence
          start_container() {
            docker run -d --name asofcast-ci -p 18080:8000 \
              -v "$PWD/ci-input/artifacts/ett-m1:/models:ro" \
              -v "$PWD/ci-runtime/optimization-onnx/serving-runtime:/runtime:ro" \
              -e ASOFCAST_ARTIFACTS=/models \
              -e ASOFCAST_RUNTIME_DIR=/runtime \
              -e ASOFCAST_SERVING_BACKEND=onnx \
              -e ASOFCAST_CLOUD_DEPLOYED=true \
              -e PORT=8000 \
              asofcast:ci
          }
          start_container
          python scripts/container_smoke.py --expected-run-id "$RUN_ID" --expected-runtime-sha "$RUNTIME_SHA" --out container-evidence/container-smoke-1.json
          docker logs asofcast-ci > container-evidence/container-1.log 2>&1
          docker rm -f asofcast-ci
          start_container
          python scripts/container_smoke.py --expected-run-id "$RUN_ID" --expected-runtime-sha "$RUNTIME_SHA" --out container-evidence/container-smoke-2.json
          docker logs asofcast-ci > container-evidence/container-2.log 2>&1
          docker rm -f asofcast-ci
          python - <<'PY'
          import json
          a=json.load(open('container-evidence/container-smoke-1.json', encoding='utf-8'))
          b=json.load(open('container-evidence/container-smoke-2.json', encoding='utf-8'))
          assert a['run_id'] == b['run_id']
          assert a['runtime_sha256'] == b['runtime_sha256']
          assert a['serving_backend'] == b['serving_backend'] == 'onnxruntime'
          json.dump({'status':'passed','restart_stable':True,'run_id':a['run_id'],
                     'runtime_sha256':a['runtime_sha256']},
                    open('container-evidence/restart-comparison.json','w',encoding='utf-8'), indent=2)
          PY
      - name: Preserve container cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-cloud-evidence
          path: container-evidence/
          if-no-files-found: error
          retention-days: 30

  reference-reproduction:
    needs: real-data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: ett-m1-bundle
          path: ci-input
      - name: Install paired CPU research harness
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Repeat pinned official versus local ETTh1 protocol
        run: |
          for run in 1 2; do
            python -m asofcast.reference_eval --csv ci-input/data/raw/ETTh1.csv --reference data/reference/DLinear.py --out research-reference/run-${run}
          done
      - name: Preserve scoped reference evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlinear-reference-evidence
          path: research-reference/
          if-no-files-found: error
          retention-days: 30

  mlops:
    needs: real-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: ett-m1-bundle
          path: ci-input
      - name: Install MLflow and DVC
        run: python -m pip install -e '.[mlops]'
      - name: Track experiment and release decision in MLflow
        run: |
          python -m asofcast track-mlflow --artifacts ci-input/artifacts/ett-m1 --tracking-uri sqlite:///mlflow.db > mlflow-result.json
          python -m asofcast release-gate --evaluation docs/research-20261002/promotion-summary.json --out release-decision.json > release-gate-result.json
          python -m asofcast track-release --decision release-decision.json --tracking-uri sqlite:///mlflow.db > mlflow-release-result.json
      - name: Version model, replay and release decision with DVC
        run: |
          mkdir -p dvc-workspace/bundle
          cp ci-input/artifacts/ett-m1/arrival.pt dvc-workspace/bundle/
          cp ci-input/artifacts/ett-m1/replay.npz dvc-workspace/bundle/
          cp release-decision.json dvc-workspace/bundle/
          cd dvc-workspace
          dvc init --no-scm
          dvc add bundle/arrival.pt bundle/replay.npz bundle/release-decision.json
          dvc status > ../dvc-status.txt
          find . -name '*.dvc' -type f -print -exec cat {} \; > ../dvc-pointers.txt
      - name: Preserve MLOps evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlops-evidence
          path: |
            mlflow-result.json
            mlflow-release-result.json
            release-gate-result.json
            release-decision.json
            mlflow.db
            dvc-status.txt
            dvc-pointers.txt
          if-no-files-found: error
          retention-days: 14

  large-data:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/point-in-time-m1' || github.ref == 'refs/heads/fix/m2-submission-audit-20260925' || github.ref == 'refs/heads/feat/dataflow-hardening-20261004' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Spark stack
        run: python -m pip install -e '.[spark]'
      - name: Download UCI ElectricityLoadDiagrams20112014
        run: |
          mkdir -p data/uci
          curl -fL --retry 3 --retry-delay 3 \
            'https://archive.ics.uci.edu/static/public/321/electricityloaddiagrams20112014.zip' \
            -o data/uci/electricity.zip
          unzip -q data/uci/electricity.zip -d data/uci/extracted
          test -f data/uci/extracted/LD2011_2014.txt
      - name: Parse 51.9M measurement cells and verify Parquet round trip
        run: |
          python -m asofcast spark-profile \
            --input data/uci/extracted/LD2011_2014.txt \
            --parquet data/uci/parquet \
            --out uci-spark-report.json
      - name: Preserve large-data evidence
        uses: actions/upload-artifact@v4
        with:
          name: large-data-evidence
          path: uci-spark-report.json
          if-no-files-found: error
          retention-days: 14


  cloud-smoke:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed health and readiness
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors             https://asofcast.onrender.com/health -o health.json
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors             https://asofcast.onrender.com/ready -o ready.json
          python - <<'PY'
          import json
          health=json.load(open('health.json',encoding='utf-8'))
          ready=json.load(open('ready.json',encoding='utf-8'))
          assert health.get('status') == 'alive', health
          assert ready.get('status') == 'ready', ready
          assert ready.get('checksums_verified') is True, ready
          print(json.dumps({'health':health,'ready':ready},ensure_ascii=False,indent=2))
          PY


  browser-consistency:
    needs: real-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: ett-m1-bundle
          path: ci-input
      - name: Install real model and browser test stack
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium
      - name: Repeat synthetic regression scenarios and ETTh1 browser flows
        run: |
          python scripts/check_browser.py --repeats 3 --out artifacts/browser-synthetic
          python scripts/check_browser.py --artifacts ci-input/artifacts/ett-m1 --repeats 3 --out artifacts/browser-ett
      - name: Preserve browser reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asofcast-browser-evidence
          path: |
            artifacts/browser-synthetic
            artifacts/browser-ett
          if-no-files-found: error
          retention-days: 30
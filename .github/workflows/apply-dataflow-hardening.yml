name: Apply Dataflow hardening patch
on:
  push:
    branches: [feat/dataflow-hardening-20261004]
    paths: [.github/workflows/apply-dataflow-hardening.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dataflow-hardening-20261004
          fetch-depth: 0
      - name: Decode and verify transfer patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .upload/hardening.patch.gz.b64 | gzip -d > /tmp/hardening.patch
          echo "3812db6e3f283cc841a1580f1f5c840d2b14a4637923b674efe2524743e936bf  /tmp/hardening.patch" | sha256sum -c -
      - name: Apply implementation commits without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sokldjs554"
          git config user.email "97650034+sokldjs554@users.noreply.github.com"
          set +e
          git am /tmp/hardening.patch
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            test "$(cat .git/rebase-apply/next)" = "5"
            test "$(cat .git/rebase-apply/last)" = "5"
            git am --skip
          fi
          test "$(git log -4 --format=%s | tail -1)" = "docs: 데이터플로 지원용 보완 설계와 구현 계획 고정"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit --amend --no-edit
      - name: Push implementation commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/dataflow-hardening-20261004

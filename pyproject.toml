[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asofcast"
version = "0.1.0"
description = "Point-in-time forecasting and learned waiting under delayed sensor arrivals"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "torch>=2.6,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.27,<1", "ruff>=0.12,<1"]
browser = ["playwright>=1.50,<2"]
optimize = ["onnx>=1.18,<2", "onnxruntime>=1.22,<2", "onnxscript>=0.4,<1"]
tracking = ["mlflow-skinny>=3,<4", "sqlalchemy>=2,<3", "alembic>=1.16,<2", "pyarrow>=20,<25"]
mlops = ["mlflow>=3,<4", "dvc>=3.60,<4"]
spark = ["pyspark>=3.5,<4", "pyarrow>=20,<25"]

[project.scripts]
asofcast = "asofcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asofcast = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
